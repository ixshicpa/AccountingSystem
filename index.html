/* Firestore has no nested arrays and no undefined: wrap inner arrays on write, unwrap on read */

const dec=v=>Array.isArray(v)?v.map(dec):(v&&typeof v==="object")?(Object.keys(v).length===1&&"__a" in v?dec(v.__a):Object.fromEntries(Object.entries(v).map(([k,x])=>[k,dec(x)]))):v;
const wd=x=>({id:x.id,exists:x.exists(),data:()=>x.exists()?dec(x.data()):undefined});
const mk=r=>({get:async()=>wd(await getDoc(r)),
  set:async d=>{if(r.parent.id===P+"signups"&&d&&!d.email)d={...d,email:auth.currentUser.email||""};await setDoc(r,enc(d))},

const cnt=doc(fs,P+"settings","counters");

    /* filtered listener: the security rules only let people read their own / their department's requests */

  /* running numbers: one atomic counter per key, so no two entries ever get the same number */
  nextSeq:k=>runTransaction(fs,async t=>{const x=await t.get(cnt),n=((x.exists()&&x.data()[k])||0)+1;t.set(cnt,{[k]:n},{merge:true});return n}),
  setSeq:(k,v)=>runTransaction(fs,async t=>{const x=await t.get(cnt),c=(x.exists()&&x.data()[k])||0;if(v<c)throw Object.assign(new Error("Number cannot go lower than the current one"),{code:"lower-than-current"});t.set(cnt,{[k]:v},{merge:true})})};
let adm=false;
const user={id:async()=>auth.currentUser.uid,canEdit:async()=>adm,isOwner:async()=>adm,
  profiles:async()=>{const m={};try{(await getDocs(collection(fs,P+"signups"))).forEach(d=>m[d.id]={email:d.data().email||""})}catch(e){}return m},
  info:()=>({email:auth.currentUser.email||"",name:window.__pcNewName||auth.currentUser.displayName||""}),
  /* Admin creates a login without leaving the app: a second Firebase app instance is used, so the admin stays signed in */
  createAccount:async(name,email,pw)=>{let a2;try{a2=getAuth(initializeApp(cfg,"adminCreate"))}catch(e){const {getApp}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");a2=getAuth(getApp("adminCreate"))}
    const c=await createUserWithEmailAndPassword(a2,email,pw);try{await updateProfile(c.user,{displayName:name})}catch(e){}const id=c.user.uid;await signOut(a2);return id},

window.__pcHint=HINT;
function login(msg,su){const E=i=>document.getElementById(i),em0=E("lem")?E("lem").value:"";
  root.innerHTML='<div class="card" style="max-width:380px;margin:30px auto"><h1>Petty Cash System</h1><div class="tabs" style="margin-top:12px"><button id="lt1" class="'+(su?"":"on")+'">Sign in</button><button id="lt2" class="'+(su?"on":"")+'">Create account</button></div>'+
  (su?'<p class="mu" style="margin:0">After you create your account, the admin sets your role and department. You can use the system once that is done.</p><label>Full name</label><input id="lnm" autocomplete="name" placeholder="Example: Juan Dela Cruz">':'')+
  '<label>Email</label><input id="lem" type="email" autocomplete="username" inputmode="email"><label>Password'+(su?' (at least 6 characters)':'')+'</label><input id="lpw" type="password" autocomplete="'+(su?'new-password':'current-password')+'">'+
  '<div class="row" style="margin-top:14px"><button class="p" id="lgo" style="flex:1">'+(su?'Create account':'Sign in')+'</button></div>'+(su?'':'<div style="margin-top:10px"><a href="#" id="lfp" class="mu">Forgot password?</a></div>')+'<div class="err" id="lerr"></div></div>';
  E("lem").value=em0;E("lerr").textContent=msg||"";
  E("lt1").onclick=()=>login("",false);E("lt2").onclick=()=>login("",true);
  const go=async()=>{const em=E("lem").value.trim(),pw=E("lpw").value;E("lerr").textContent="";E("lgo").disabled=true;
    try{if(su){const nm=E("lnm").value.trim();if(!nm){E("lerr").textContent="Please enter your full name.";E("lgo").disabled=false;return}

  if(!u){if(started)return location.reload();return login()}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const peso=n=>"₱"+Number(n||0).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date(Date.now()+8*36e5).toISOString().slice(0,10); /* Philippine date, not UTC */
let CT={},unsubCT=null;
const nextNo=async(k,pre,pad,fb)=>pre+String(db.nextSeq?await db.nextSeq(k):fb).padStart(pad,"0");
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const ST={pending:["Waiting for supervisor",""],approved:["Approved, waiting for release","w"],released:["Released, needs liquidation","w"],liquidated:["Liquidated, needs checking","w"],closed:["Closed",""],rejected:["Rejected","e"]};
ST.returned=["Returned for clarification","w"];
let db,uid,prof,reqs=[],tab="",mode="",unsub,unsubS,VS={company:"",prefix:"PCV-",days:5,lowFund:5000,noRcptMax:200},ARM="",accF="rel",vsOpen=false;
const ROLES={requester:"Requester (Staff)",supervisor:"Supervisor",accounting:"Accounting"};

let AA={},FD=[],PA={},unsubAA,unsubFD,unsubPA,unsubP,unsubSE,ETS=null,ETD=null,audM=today().slice(0,7),audAll=false,UU,isAdmin=false,SU=[],RO={},unsubR,unsubSU,unsubRO;
const softRender=()=>{const ae=document.activeElement;if(!(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)))render()};
async function init(){
  try{UU=await claude.use("user");db=await claude.use("db");if(!db||!UU){$("#app").innerHTML='<div class="card">Cannot open the database. Please sign in and open this link as a <b>Contributor</b> or higher.</div>';return}
  uid=await UU.id();isAdmin=!!(await UU.canEdit())||!!(await UU.isOwner());}catch(e){$("#app").innerHTML='<div class="card">Could not load the system.</div>';return}
  let su=null;try{const x=await db.doc("signups/"+uid).get();su=x.exists?x.data():null}catch(e){}
  /* No separate username step: the name typed when the account was created is used.
     Older accounts made in the Firebase console get their display name, or the first part of their email. */
  if(!su||!su.name){const i=UU.info?UU.info():{},name=(i.name||(i.email||"").split("@")[0]||"User").trim();
    try{await db.doc("signups/"+uid).set({name,email:i.email||"",joinedAt:Date.now()})}catch(e){}su={name}}
  gate(su.name);
}
function stopData(){if(unsubCT){unsubCT();unsubCT=null}if(unsub){unsub();unsub=null}if(unsubS){unsubS();unsubS=null}if(unsubSU){unsubSU();unsubSU=null}if(unsubRO){unsubRO();unsubRO=null}if(unsubSE){unsubSE();unsubSE=null}if(unsubAA){unsubAA();unsubAA=null}if(unsubFD){unsubFD();unsubFD=null}if(unsubPA){unsubPA();unsubPA=null}}
function pending(name){stopData();$("#app").innerHTML=`<div class="card" style="max-width:480px;margin:30px auto"><h1>Waiting for access</h1><p>Hi <b>${esc(name)}</b>! Your account was created and is <b>waiting for the admin</b> to set your role and department. This page updates by itself once that is done.</p><p class="mu">If you are the admin: in Firestore, create the document <b>pc_admins/${esc(window.__pcUid||"")}</b> (any field), then refresh this page.${window.__pcAdmErr?" Admin check error: "+esc(window.__pcAdmErr):""}</p></div>`}
function gate(name){
  if(isAdmin){prof={role:"accounting",dept:"Accounting Department",name};tab="";start();return}
  if(unsubR)unsubR();if(unsubP)unsubP();
  let rd=null,pd=null;
  const apply=()=>{const d=rd&&rd.role?rd:pd;if(!d||!d.role||d.role==="pending"){prof=null;pending(name);return}
    const np={role:d.role,dept:d.dept||"",name},ch=!prof||prof.role!==np.role||prof.dept!==np.dept;prof=np;if(ch){tab="";start()}};
  unsubR=db.doc("roles/"+uid).onSnapshot(x=>{rd=x.exists?x.data():null;apply()},()=>pending(name));
  unsubP=db.doc("preapproved/"+dkey(name)).onSnapshot(x=>{pd=x.exists?x.data():null;apply()},()=>{});
}
function start(){
  mode=prof.role==="accounting"?"todo":"list";tab=tab||(prof.role==="accounting"?"todo":prof.role==="supervisor"?"todo":"new");
  stopData();
  unsubSE=db.doc("settings/expenseTypes").onSnapshot(x=>{const d=x.exists?x.data():null;ETS=d&&Array.isArray(d.list)?d.list:null;softRender()},()=>{});
  unsubAA=db.collection("autoapprove").onSnapshot(x=>{AA={};x.docs.forEach(d=>AA[d.id]=d.data()||{});softRender()},()=>{});
  if(prof.role==="accounting")unsubFD=db.collection("fund").onSnapshot(x=>{FD=x.docs.map(d=>d.data());softRender()},()=>{});
  if(isAdmin){LD={};unsubPA=db.collection("preapproved").onSnapshot(x=>{PA={};x.docs.forEach(d=>PA[d.id]=d.data());LD.pa=1;migratePA();softRender()},()=>{});unsubSU=db.collection("signups").onSnapshot(x=>{SU=x.docs.map(d=>({id:d.id,...d.data()}));LD.su=1;migratePA();softRender()},()=>{});unsubRO=db.collection("roles").onSnapshot(x=>{RO={};x.docs.forEach(d=>RO[d.id]=d.data());LD.ro=1;migratePA();softRender()},()=>{})}
  unsubCT=db.doc("settings/counters").onSnapshot(x=>{CT=x.exists?x.data():{};},()=>{});
  unsubS=db.doc("settings/voucher").onSnapshot(x=>{if(x.exists)VS={...VS,...x.data()};const ae=document.activeElement;if(!(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)))render()},()=>{});
  /* Each role only loads what it may see (the Firestore rules enforce the same thing on the server) */
  const RQ=db.collection("requests"),src=(prof.role==="accounting"||isAdmin||!RQ.where)?RQ:prof.role==="supervisor"?RQ.where("dept",prof.dept):RQ.where("createdBy",uid);
  unsub=src.onSnapshot(s=>{reqs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.createdAt-a.createdAt);const ae=document.activeElement;if(ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)&&$("#app").contains(ae)&&["new","users","setup","auto"].includes(tab))return;render()},e=>{$("#app").innerHTML='<div class="card">Cannot read requests ('+esc(e.code)+').</div>'});
}
const mine=()=>reqs.filter(r=>prof.role==="accounting"||(prof.role==="supervisor"?r.dept===prof.dept:r.createdBy===uid));
const open=n=>reqs.some(r=>(r.status==="released"||r.status==="liquidated")&&r.employee.trim().toLowerCase()===n.trim().toLowerCase());

function capFS(){if($("#sub")){FS={};["dn","n","dp","a","et","p","rm","eo","ur","urr"].forEach(k=>{const e=$("#"+k);if(e)FS[k]=e.type==="checkbox"?e.checked:e.value})}}
const isLate=r=>r.status==="released"&&r.dueDate&&r.dueDate<today();
const pl=(n,s,p)=>n+" "+(n===1?s:p);
/* Reminder banner at the top: what is waiting for this person */
function banner(){
  const R=prof.role,L=mine(),c=f=>L.filter(f).length,it=[],od=c(isLate),add=(n,txt,t,f)=>{if(n>0)it.push(`<a data-t="${t}"${f?` data-bf="${f}"`:""}>${txt}</a>`)};
  if(R==="accounting"){const n1=c(r=>r.status==="approved"),n2=c(r=>r.status==="pending"),n3=c(r=>r.status==="liquidated");
    add(n1,pl(n1,"request","requests")+" for release","todo","rel");add(n3,pl(n3,"liquidation","liquidations")+" to check","todo","verify");add(od,pl(od,"overdue liquidation","overdue liquidations"),"todo","open");add(n2,pl(n2,"request","requests")+" waiting for supervisor","todo","wait")}
  else if(R==="supervisor"){const n1=c(r=>r.status==="pending"),n2=c(r=>r.status==="returned");
    add(n1,pl(n1,"request","requests")+" waiting for your approval","todo");add(n2,pl(n2,"request","requests")+" returned by Accounting","todo");add(od,pl(od,"overdue liquidation","overdue liquidations"),"list")}
  else{const n1=c(r=>r.status==="released")-od,n2=c(r=>r.status==="returned");
    add(od,pl(od,"overdue liquidation","overdue liquidations")+" – please liquidate now","todo");add(n1,pl(n1,"cash advance","cash advances")+" to liquidate","todo");add(n2,pl(n2,"request","requests")+" returned to you – reply needed","todo")}
  return it.length?`<div class="banner${od?" bad":""}"><b>Reminders:</b> ${it.join(" <span>·</span> ")}</div>`:""}

  if(!skipCap)capFS();skipCap=false;

  FD.forEach(f=>{const v=f.type==="decrease"?-f.amount:f.amount;add+=v;ev.push({t:f.t,l:({opening:"Opening balance",replenish:"Money added",decrease:"Money removed"}[f.type]||"Entry")+(f.note?" – "+f.note:""),v})});
  reqs.forEach(r=>{if(r.releasedAt){ev.push({t:r.releasedAt,l:"Cash released – "+r.voucherNo+" ("+r.employee+")",v:-r.cashReceived});rel+=r.cashReceived}
    if(r.settleType==="returned"){ev.push({t:r.settledAt,l:"Excess returned – "+r.voucherNo,v:r.settleAmount});ret+=r.settleAmount}
    if(r.settleType==="additional"){ev.push({t:r.settledAt,l:"Additional cash given – "+r.voucherNo,v:-r.settleAmount});ex+=r.settleAmount}
    if(r.status==="released"||r.status==="liquidated")out+=r.cashReceived});
  ev.sort((a,b)=>a.t-b.t);ev.forEach(e=>{bal+=e.v;e.b=bal});
  return{bal,add,net:rel-ret+ex,out,ev:ev.reverse()};
}
function fundView(){
  const f=fundCalc();
  return `<div class="g2" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px">${[[peso(f.bal),"Current fund balance"],[peso(f.add),"Money added to the fund"],[peso(f.net),"Net cash paid out"],[peso(f.out),"Cash with employees (not settled)"]].map(([v,l])=>`<div class="card" style="margin:0"><div class="amt" style="font-size:18px">${v}</div><div class="mu">${l}</div></div>`).join("")}</div>
  <div class="card"><h2>Add or remove money</h2><div class="fg"><div><label>Type</label><select id="ft2"><option value="opening">Opening balance</option><option value="replenish">Add money (replenishment)</option><option value="decrease">Remove money (correction)</option></select></div><div><label>Amount (₱)</label><input id="fa" type="number" step="0.01" min="0"></div><div style="grid-column:span 2"><label>Note</label><input id="fn"></div></div><div class="row" style="margin-top:10px"><button class="p" id="fadd">Save</button></div><div class="err" id="fe"></div></div>
  <h2>Fund history</h2><div class="card tw"><table><tr><th>Date</th><th>Description</th><th>In</th><th>Out</th><th>Balance</th></tr>${f.ev.map(e=>`<tr><td>${pht(e.t)}</td><td>${esc(e.l)}</td><td class="amt">${e.v>0?peso(e.v):""}</td><td class="amt">${e.v<0?peso(-e.v):""}</td><td class="amt">${peso(e.b)}</td></tr>`).join("")||'<tr><td colspan="5" class="mu">No entries yet. Add the opening balance first.</td></tr>'}</table></div>`;
}
function bindFund(){
  $("#fadd").onclick=async()=>{const a=parseFloat($("#fa").value);if(!(a>0)){$("#fe").textContent="Enter an amount.";return}
    try{await db.collection("fund").doc("f"+Date.now()).set({t:Date.now(),type:$("#ft2").value,amount:a,note:$("#fn").value.trim(),by:prof.name})}catch(e){$("#fe").textContent="Could not save: "+e.code}};
}
let setupSub="fund";
function setupView(){
  const subs=[["fund","Petty cash fund"],["types","Expense types & voucher"]];if(isAdmin)subs.push(["limits","Approval limits"]);
  if(!subs.some(x=>x[0]===setupSub))setupSub="fund";
  return `<div class="row" style="margin-bottom:12px">${subs.map(([k,l])=>`<button data-ss="${k}" class="chip ${setupSub===k?"on":""}">${l}</button>`).join("")}</div>`+(setupSub==="fund"?fundView():setupSub==="types"?settingsView():autoView());
}
function bindSetup(){
  document.querySelectorAll("#app [data-ss]").forEach(b=>b.onclick=()=>{setupSub=b.dataset.ss;ETD=null;render()});
  if(setupSub==="fund")bindFund();else if(setupSub==="types")bindSettings();else bindAuto();
}
